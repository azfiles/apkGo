name: Godot Android · build, verify, release
on:
  push:
    branches: [main]
    paths: ['godot/**', 'scripts/godot/**', 'signing/**', '.github/workflows/godot-android.yml']
  pull_request:
    paths: ['godot/**', 'scripts/godot/**', 'signing/**', '.github/workflows/godot-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install checksum-pinned Godot 4.6.3 and Android templates
        run: bash scripts/godot/setup.sh
      - name: Test model, input, physics, particles and all nine levels
        run: bash scripts/godot/test.sh
      - name: Export and verify signed release APK
        run: bash scripts/godot/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and interact with release APK on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/godot/android-smoke.sh
      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-verified-apk
          path: build/godot/output/*
          if-no-files-found: error
      - name: Preserve test reports and device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-verification
          path: |
            build/godot/*report.txt
            build/godot/logcat.txt
            build/godot/screenshots/**
          if-no-files-found: warn
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-verified-apk
          path: release/apk
      - uses: actions/download-artifact@v4
        with:
          name: godot-verification
          path: release/evidence
      - name: Publish immutable verified demo release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="godot-v2.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cp docs/godot-release-notes.md release/notes.md
          printf '\n源码提交：%s\n\n验证运行：https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/notes.md
          cat release/evidence/round-report.txt release/evidence/scene-report.txt release/evidence/android-report.txt >> release/notes.md
          tar -czf release/verification.tar.gz -C release/evidence .
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This exact verified release is already published; leaving it immutable.'
          else
            gh release create "$TAG" release/apk/* release/verification.tar.gz --target "$GITHUB_SHA" --title '循光 · Godot 2.0 · 物理关卡体验版' --notes-file release/notes.md --prerelease
          fi
