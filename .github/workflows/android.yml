name: Build, smoke test and release APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'tests/**', 'signing/**', 'build.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test round logic
        run: |
          mkdir -p build/model
          javac -d build/model app/src/main/java/com/alex/schulteflow/GameSession.java tests/GameSessionTest.java
          java -cp build/model GameSessionTest | tee build/model-report.txt
      - name: Build and verify signed APK
        run: bash build.sh
      - name: Build instrumentation
        run: bash tests/build-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: build/output/*
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/run-smoke.sh
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            build/*report.txt
            build/logcat.txt
            build/screenshots/**
      - name: Publish installable demo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp docs/release-notes.md build/release-notes.md
          printf '\n构建提交：%s\n\n' "$GITHUB_SHA" >> build/release-notes.md
          cat build/model-report.txt build/smoke-report.txt >> build/release-notes.md
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/output/* build/model-report.txt build/smoke-report.txt --clobber
            gh release edit v1.0.0 --notes-file build/release-notes.md
          else
            gh release create v1.0.0 build/output/* build/model-report.txt build/smoke-report.txt --target "$GITHUB_SHA" --title '循光·舒尔特 v1.0.0 · 体验版' --notes-file build/release-notes.md --prerelease
          fi
